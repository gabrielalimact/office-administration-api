name: CI/CD - Office Administration

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: 🧪 CI - Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Instala dependências
      - name: Install dependencies
        run: npm i

      # 4️⃣ Build
      - name: Build project
        run: npm run build

  deploy:
    name: 🚀 CD - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Deploy iniciado no servidor..."
            cd /office-administration-api

            echo "🌀 Atualizando código..."
            git pull origin main

            echo "📦 Instalando dependências..."
            npm ci --omit=dev

            echo "🏗️  Gerando build..."
            npm run build

            echo "🔁 Reiniciando serviço com PM2..."
            pm2 restart office-administration-api

            echo "✅ Deploy finalizado com sucesso!"
